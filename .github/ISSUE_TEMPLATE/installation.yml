name: Installation help
description: onboard.sh, MCP, or first-win verify failed
title: "[Install] "
labels: ["installation"]
body:
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      placeholder: bash scripts/onboard.sh . --verify
  - type: textarea
    id: error
    attributes:
      label: Error or behavior
  - type: input
    id: env
    attributes:
      label: OS / Python / Cursor version
