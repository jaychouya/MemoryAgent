<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .msg { animation: slideUp 0.5s ease-out forwards; opacity: 0; }
      .d1 { animation-delay: 0.3s; }
      .d2 { animation-delay: 0.8s; }
      .d3 { animation-delay: 1.5s; }
      .d4 { animation-delay: 2.2s; }
      .d5 { animation-delay: 3.0s; }
      .d6 { animation-delay: 3.8s; }
      .d7 { animation-delay: 4.5s; }
      .d8 { animation-delay: 5.2s; }
      .d9 { animation-delay: 6.0s; }
      .d10 { animation-delay: 6.8s; }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#1e293b"/>
  <circle cx="20" cy="15" r="6" fill="#ef4444"/>
  <circle cx="40" cy="15" r="6" fill="#eab308"/>
  <circle cx="60" cy="15" r="6" fill="#22c55e"/>
  <text x="400" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">🧠 MemoryAgent - 记忆效果演示</text>
  
  <!-- Scene 1: User input -->
  <g class="msg d1">
    <rect x="420" y="70" width="360" height="45" rx="12" fill="#4f46e5"/>
    <text x="600" y="97" fill="white" font-size="13" text-anchor="middle">我喜欢 Python，讨厌 Java，因为 Python 语法简洁</text>
  </g>
  
  <!-- Memory save indicator -->
  <g class="msg d2">
    <rect x="20" y="130" width="300" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="35" y="150" fill="#fbbf24" font-size="12">💾 正在保存记忆...</text>
  </g>
  
  <!-- AI response 1 -->
  <g class="msg d3">
    <rect x="20" y="175" width="400" height="100" rx="12" fill="#334155"/>
    <text x="35" y="200" fill="#e2e8f0" font-size="13">好的，我记住了你的偏好：</text>
    <text x="35" y="220" fill="#a5f3fc" font-size="12">• 喜欢 Python</text>
    <text x="35" y="240" fill="#a5f3fc" font-size="12">• 讨厌 Java</text>
    <text x="35" y="260" fill="#a5f3fc" font-size="12">• 原因：语法简洁</text>
  </g>
  
  <!-- Divider -->
  <g class="msg d4">
    <line x1="20" y1="300" x2="780" y2="300" stroke="#334155" stroke-width="1"/>
    <text x="400" y="320" fill="#818cf8" font-size="11" text-anchor="middle">📍 场景 2: 新对话 - 自动使用记忆</text>
  </g>
  
  <!-- Memory retrieval -->
  <g class="msg d5">
    <rect x="20" y="340" width="450" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="35" y="357" fill="#fbbf24" font-size="11">📚 找到 1 条相关记忆: "用户喜欢 Python" (相关度: 0.95)</text>
  </g>
  
  <!-- User input 2 -->
  <g class="msg d6">
    <rect x="500" y="380" width="280" height="35" rx="12" fill="#4f46e5"/>
    <text x="640" y="403" fill="white" font-size="13" text-anchor="middle">帮我写个排序函数</text>
  </g>
  
  <!-- AI response 2 -->
  <g class="msg d7">
    <rect x="20" y="430" width="500" height="150" rx="12" fill="#334155"/>
    <text x="35" y="455" fill="#e2e8f0" font-size="13">用 Python 实现（因为你偏好 Python）：</text>
    <rect x="35" y="465" width="350" height="80" rx="6" fill="#0f172a"/>
    <text x="45" y="485" fill="#a5f3fc" font-size="11" font-family="monospace">def bubble_sort(arr):</text>
    <text x="45" y="500" fill="#a5f3fc" font-size="11" font-family="monospace">    n = len(arr)</text>
    <text x="45" y="515" fill="#a5f3fc" font-size="11" font-family="monospace">    for i in range(n):</text>
    <text x="45" y="530" fill="#a5f3fc" font-size="11" font-family="monospace">        ...</text>
    <text x="35" y="560" fill="#94a3b8" font-size="11">这个实现简洁易读，符合 Python 风格。</text>
  </g>
  
  <!-- Footer -->
  <g class="msg d10">
    <text x="400" y="595" fill="#64748b" font-size="12" text-anchor="middle">⭐ github.com/jaychouya/MemoryAgent</text>
  </g>
</svg>
